name: Native controls and settings
on:
  workflow_dispatch:
  pull_request:
    paths: ['ios/**', '.github/workflows/native-controls.yml']
permissions:
  contents: read
jobs:
  controls:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select latest installed Xcode
        run: |
          python3 - <<'PY'
          import glob,os,plistlib
          apps=[]
          for app in glob.glob('/Applications/Xcode*.app'):
              with open(app+'/Contents/Info.plist','rb') as f:v=plistlib.load(f)['CFBundleShortVersionString']
              apps.append((tuple(map(int,v.split('.'))),app))
          app=max(apps)[1]
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('DEVELOPER_DIR='+app+'/Contents/Developer\n')
          print(app)
          PY
      - name: Compile actual UIKit controls and settings without game content
        run: |
          mkdir -p out/ControlsSmoke.app
          python3 - <<'PY'
          import plistlib
          with open('out/ControlsSmoke.app/Info.plist','wb') as f:
              plistlib.dump(dict(CFBundleExecutable='ControlsSmoke',CFBundleIdentifier='org.stormrevolution.controlsmoke',CFBundlePackageType='APPL',CFBundleVersion='1',CFBundleShortVersionString='1.0',LSRequiresIPhoneOS=True,UILaunchScreen={},UISupportedInterfaceOrientations=['UIInterfaceOrientationLandscapeLeft','UIInterfaceOrientationLandscapeRight']),f)
          PY
          xcrun --sdk iphonesimulator clang++ -std=c++23 -fobjc-arc -fblocks \
            -target "$(uname -m)-apple-ios17.0-simulator" -isysroot "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -Iios -Iruntime ios/Native/Tests/ControlsSmoke.mm ios/Controls/StormControls.mm \
            ios/Native/StormNativePreferences.mm ios/Native/StormNativeOptions.mm \
            -framework UIKit -framework Foundation -framework GameController -framework QuartzCore -framework CoreGraphics \
            -o out/ControlsSmoke.app/ControlsSmoke
          codesign --force --sign - out/ControlsSmoke.app
      - name: Exercise inputs, layout limits and persisted settings
        timeout-minutes: 12
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c 'import json,re,sys;r=json.load(sys.stdin)["devices"];keys=sorted((k for k in r if "iOS" in k),key=lambda k:tuple(map(int,re.findall(r"\d+",k))),reverse=True);d=next([v for v in r[k] if v.get("isAvailable") and "iPhone" in v["name"]] for k in keys if any(v.get("isAvailable") and "iPhone" in v["name"] for v in r[k]));print(next((v for v in d if v["name"]=="iPhone 15 Pro"),d[0])["udid"])')
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" out/ControlsSmoke.app
          xcrun simctl launch "$device_id" org.stormrevolution.controlsmoke
          data_path=$(xcrun simctl get_app_container "$device_id" org.stormrevolution.controlsmoke data)
          for attempt in $(seq 1 60); do
            if [ -f "$data_path/Documents/controls-smoke.json" ]; then break; fi
            sleep 1
          done
          cp "$data_path/Documents/controls-smoke.json" out/controls-smoke.json
          python3 -c 'import json;v=json.load(open("out/controls-smoke.json"));print(v);assert v["passed"] and not v["game_executed"]'
          xcrun simctl io "$device_id" screenshot out/controls.png
          xcrun simctl terminate "$device_id" org.stormrevolution.controlsmoke
          xcrun simctl launch "$device_id" org.stormrevolution.controlsmoke --options
          sleep 3
          xcrun simctl io "$device_id" screenshot out/options.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-controls-validation-no-game
          path: |
            out/*.json
            out/*.png
          retention-days: 7
